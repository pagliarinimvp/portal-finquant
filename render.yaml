# Blueprint do Render para o Portal FinQuant.
# Uso: no dashboard do Render, "New +" -> "Blueprint" -> conecte este
# repositório. O Render lê este arquivo e cria o Web Service e o banco
# Postgres automaticamente. Veja o README ("Deploy (Render.com)") para o
# passo a passo completo, incluindo o login social.

databases:
  - name: portal-finquant-db
    plan: free

services:
  - type: web
    plan: free
    name: portal-finquant
    runtime: python
    # preDeployCommand não é suportado no plano free — migrate e
    # bootstrap_admin ficam no buildCommand mesmo (ver histórico do
    # commit que tentou mover para pre-deploy: o Blueprint Sync rejeitou
    # com "pre-deploy command is not supported for free tier services").
    buildCommand: 'pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_admin && python manage.py bootstrap_site'
    startCommand: 'gunicorn config.wsgi'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '.onrender.com'
      - key: CSRF_TRUSTED_ORIGINS
        value: 'https://*.onrender.com'
      # Domínio real do Site (django.contrib.sites), aplicado no build pelo
      # bootstrap_site — sem isso, o "Ver no site" do admin e o login social
      # apontam para o "example.com" padrão do Django.
      - key: SITE_DOMAIN
        value: 'portal-finquant.onrender.com'
      - key: DATABASE_URL
        fromDatabase:
          name: portal-finquant-db
          property: connectionString
      # Superusuário de admin, criado pelo bootstrap_admin no build
      # (veja contas/management/commands/bootstrap_admin.py). Preencha uma
      # vez no formulário do Render; ele nunca sobrescreve a senha depois
      # que o usuário já existe, então trocar a senha aqui não tem efeito —
      # troque pelo próprio /admin/ ou por `manage.py changepassword`.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Login social (opcional). Deixe em branco no formulário do Render
      # para não mostrar os botões, ou preencha com as credenciais de
      # produção (veja docs/superpowers/specs/2026-08-17-login-social-design.md).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
