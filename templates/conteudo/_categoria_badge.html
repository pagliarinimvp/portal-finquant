{% if categoria == "RENDA_FIXA" %}
<span class="fq-badge-categoria fq-cat-renda-fixa">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 2.5l6 2.2v4c0 4.2-2.6 7.3-6 8.3-3.4-1-6-4.1-6-8.3v-4l6-2.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M7.2 10l1.8 1.8 3.8-3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{ label }}
</span>
{% elif categoria == "RENDA_VARIAVEL" %}
<span class="fq-badge-categoria fq-cat-renda-variavel">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M2.5 13.5l3-4 2.5 2.5 4-6 5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 16.5h15" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    </svg>
    {{ label }}
</span>
{% elif categoria == "ANALISE_QUANTITATIVA" %}
<span class="fq-badge-categoria fq-cat-analise-quantitativa">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.3">
            <line x1="4" y1="15" x2="4" y2="10"/>
            <line x1="7" y1="15" x2="7" y2="7"/>
            <line x1="10" y1="15" x2="10" y2="11"/>
        </g>
        <circle cx="13.5" cy="8.5" r="3.6" stroke="currentColor" stroke-width="1.4"/>
        <line x1="16" y1="11" x2="18.2" y2="13.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    {{ label }}
</span>
{% else %}
<span class="fq-badge-categoria fq-cat-fundamentos">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 5.5C8.5 4.3 6.3 4 4 4v10c2.3 0 4.5.3 6 1.5M10 5.5c1.5-1.2 3.7-1.5 6-1.5v10c-2.3 0-4.5.3-6 1.5M10 5.5v11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{ label }}
</span>
{% endif %}
